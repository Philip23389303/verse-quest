<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Verse Quest" />
<meta name="theme-color" content="#C9A227" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<title>Verse Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --ivory:#FBF8F1;
    --ivory-2:#F3EDDF;
    --gold:#C9A227;
    --gold-2:#E6C158;
    --gold-deep:#8B6914;
    --ink:#2B2320;
    --ink-soft:#5C5347;
    --line:#E4D9BE;
    --flame:#C9772A;
    --good:#4C7A4C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #FFFDF7 0%, var(--ivory) 55%, var(--ivory-2) 100%);
    font-family:'Inter', -apple-system, sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  .app{ width:100%; max-width:480px; padding:22px 20px 40px; position:relative; }

  /* install banner */
  .install-banner{ display:none; align-items:center; gap:10px; background:linear-gradient(90deg, var(--gold-2), var(--gold)); color:var(--ivory); border-radius:14px; padding:12px 14px; margin-bottom:16px; font-size:13px; font-weight:600; line-height:1.4; }
  .install-text{ flex:1; }
  .install-text b{ font-weight:800; }
  .install-close{ background:rgba(255,255,255,0.25); border:none; color:var(--ivory); width:24px; height:24px; border-radius:50%; font-size:12px; cursor:pointer; flex-shrink:0; }

  /* header */
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:34px; height:34px; border-radius:50%; background:conic-gradient(from 210deg, var(--gold-2), var(--gold), var(--gold-deep), var(--gold-2)); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(139,105,20,0.35); }
  .brand-mark::after{ content:"✝"; color:var(--ivory); font-size:16px; font-weight:700; }
  .brand-name{ font-family:'Cormorant Garamond', serif; font-weight:700; font-size:21px; letter-spacing:0.3px; }
  .streak-pill{ display:flex; align-items:center; gap:5px; background:var(--ivory); border:1px solid var(--line); padding:6px 12px; border-radius:20px; font-weight:700; font-size:14px; color:var(--flame); box-shadow:0 1px 2px rgba(0,0,0,0.03); }

  /* level bar */
  .level-card{ background:var(--ivory); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:20px; }
  .level-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .level-name{ font-family:'Cormorant Garamond', serif; font-weight:700; font-size:17px; }
  .level-xp{ font-size:12px; color:var(--ink-soft); font-weight:600; }
  .bar-track{ height:8px; border-radius:6px; background:var(--ivory-2); overflow:hidden; border:1px solid var(--line); }
  .bar-fill{ height:100%; background:linear-gradient(90deg, var(--gold-2), var(--gold)); border-radius:6px; transition:width 0.6s ease; }

  /* seal stage */
  .stage{ background:var(--ivory); border:1px solid var(--line); border-radius:22px; padding:34px 22px; text-align:center; box-shadow:0 6px 24px rgba(139,105,20,0.08); margin-bottom:18px; min-height:300px; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  .date-label{ font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-soft); font-weight:700; margin-bottom:18px; }

  .seal{ width:130px; height:130px; border-radius:50%; cursor:pointer; position:relative; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 32% 28%, var(--gold-2), var(--gold) 55%, var(--gold-deep) 100%); box-shadow:0 10px 22px rgba(139,105,20,0.35), inset 0 2px 6px rgba(255,255,255,0.4); transition:transform 0.25s ease; }
  .seal:active{ transform:scale(0.94); }
  .seal::before{ content:"✝"; font-size:46px; color:var(--ivory); }
  .seal-crack{ animation:crack 0.5s ease forwards; }
  @keyframes crack{ 0%{transform:scale(1) rotate(0);} 40%{transform:scale(1.08) rotate(-4deg);} 70%{transform:scale(0.9) rotate(3deg);} 100%{transform:scale(0) rotate(0deg); opacity:0;} }
  .tap-hint{ margin-top:16px; font-size:13px; color:var(--ink-soft); font-weight:600; }

  .verse-wrap{ display:none; }
  .verse-ref{ font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold-deep); font-weight:700; margin-bottom:10px; opacity:0; animation:fadeUp 0.5s ease forwards; }
  .verse-text{ font-family:'Cormorant Garamond', serif; font-size:24px; line-height:1.5; font-weight:600; color:var(--ink); }
  .word{ opacity:0; display:inline-block; animation:fadeUp 0.45s ease forwards; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .done-badge{ display:none; margin-top:16px; font-size:13px; color:var(--good); font-weight:700; }
  .share-btn{ display:none; margin-top:16px; background:none; border:1px solid var(--line); color:var(--ink-soft); font-weight:700; font-size:13px; padding:8px 16px; border-radius:20px; cursor:pointer; }

  .quiz-sub{ display:none; font-size:13px; color:var(--ink-soft); margin-top:14px; }
  .blank-slot-inline{ border-bottom:2px solid var(--gold); color:var(--gold-deep); font-weight:700; }
  .options{ display:none; flex-direction:column; gap:10px; margin-top:16px; text-align:left; }
  .opt-btn{ text-align:left; padding:13px 16px; border-radius:14px; border:1.5px solid var(--line); background:#fff; font-family:'Inter'; font-size:15px; font-weight:600; color:var(--ink); cursor:pointer; transition:all 0.15s ease; }
  .opt-btn:active{ transform:scale(0.98); }
  .opt-btn.correct{ background:#EAF4EA; border-color:var(--good); color:var(--good); }
  .opt-btn.wrong{ background:#F7E9E4; border-color:#B8543A; color:#B8543A; }
  .challenge-result{ margin-top:16px; font-size:14px; font-weight:700; text-align:center; display:none; }

  /* stats grid */
  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
  .stat-box{ background:var(--ivory); border:1px solid var(--line); border-radius:14px; padding:14px 10px; text-align:center; }
  .stat-num{ font-family:'Inter', sans-serif; font-variant-numeric:lining-nums tabular-nums; font-size:24px; font-weight:800; color:var(--gold-deep); }
  .stat-label{ font-size:10.5px; letter-spacing:0.5px; text-transform:uppercase; color:var(--ink-soft); font-weight:700; margin-top:2px; }

  /* badges */
  .section-title{ font-family:'Cormorant Garamond', serif; font-size:18px; font-weight:700; margin:6px 0 10px 2px; }
  .badges{ display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; }
  .badge{ flex:0 0 auto; width:78px; text-align:center; }
  .badge-icon{ width:58px; height:58px; border-radius:50%; margin:0 auto 6px; display:flex; align-items:center; justify-content:center; font-size:22px; background:var(--ivory-2); border:1.5px solid var(--line); color:var(--line); }
  .badge.unlocked .badge-icon{ background:conic-gradient(from 210deg, var(--gold-2), var(--gold), var(--gold-deep), var(--gold-2)); color:var(--ivory); border-color:transparent; box-shadow:0 4px 10px rgba(139,105,20,0.3); }
  .badge-label{ font-size:10.5px; font-weight:700; color:var(--ink-soft); }

  .footer-note{ text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:22px; opacity:0.75; }

  /* library button */
  .library-btn{ display:block; width:100%; margin-top:6px; padding:14px; border-radius:16px; border:1px solid var(--line); background:var(--ivory); color:var(--gold-deep); font-weight:700; font-size:14px; cursor:pointer; font-family:'Inter'; }
  .library-btn:active{ transform:scale(0.98); }

  /* modal */
  .modal-overlay{ display:none; position:fixed; inset:0; background:rgba(43,35,32,0.55); z-index:50; align-items:flex-end; justify-content:center; }
  .modal-card{ background:var(--ivory); width:100%; max-width:480px; max-height:85vh; border-radius:22px 22px 0 0; padding:20px 20px 28px; display:flex; flex-direction:column; overflow:hidden; }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .modal-title{ font-family:'Cormorant Garamond', serif; font-weight:700; font-size:22px; }
  .modal-close{ background:var(--ivory-2); border:none; width:30px; height:30px; border-radius:50%; font-size:14px; color:var(--ink-soft); cursor:pointer; }
  .modal-progress{ font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-bottom:14px; }
  .modal-tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .tab-btn{ flex:1; padding:9px; border-radius:12px; border:1px solid var(--line); background:#fff; font-weight:700; font-size:13px; color:var(--ink-soft); cursor:pointer; }
  .tab-btn.active{ background:var(--gold); color:var(--ivory); border-color:var(--gold); }
  .modal-body{ overflow-y:auto; }

  .lib-item{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .lib-ref{ font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--gold-deep); font-weight:700; margin-bottom:4px; }
  .lib-text{ font-family:'Cormorant Garamond', serif; font-size:16px; line-height:1.4; color:var(--ink); }
  .lib-theme-tag{ display:inline-block; margin-top:6px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:var(--gold-deep); background:var(--ivory-2); padding:3px 8px; border-radius:8px; }
  .lib-empty{ text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 10px; }

  .theme-row{ margin-bottom:16px; cursor:pointer; }
  .theme-row-top{ display:flex; justify-content:space-between; font-size:13px; font-weight:700; margin-bottom:6px; }
  .theme-row-top span:last-child{ color:var(--ink-soft); font-weight:600; }

  .completion-banner{ background:linear-gradient(90deg, var(--gold-2), var(--gold)); color:var(--ivory); border-radius:14px; padding:14px; text-align:center; font-weight:700; font-size:13.5px; margin-bottom:14px; }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body>
<div class="app">

  <div class="install-banner" id="installBanner">
    <div class="install-text" id="installText"></div>
    <button class="install-close" id="installClose" aria-label="Dismiss">✕</button>
  </div>

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-name">Verse Quest</div>
    </div>
    <div class="streak-pill">🔥 <span id="streakNum">0</span></div>
  </div>

  <div class="level-card">
    <div class="level-row">
      <div class="level-name" id="levelName">Seed</div>
      <div class="level-xp" id="levelXp">0 / 50 XP</div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
  </div>

  <div class="stage" id="stage">
    <div class="date-label" id="dateLabel">TODAY</div>
    <div class="seal" id="sealBtn"></div>
    <div class="tap-hint" id="tapHint">Tap the seal to open today's verse</div>

    <div class="verse-wrap" id="verseWrap">
      <div class="verse-ref" id="verseRef"></div>
      <div class="verse-text" id="verseText"></div>
      <div class="quiz-sub" id="quizSub">Guess the missing word to unlock the verse</div>
      <div class="options" id="options"></div>
      <div class="challenge-result" id="challengeResult"></div>
      <div class="done-badge" id="doneBadge">✓ Verse complete for today</div>
      <button class="share-btn" id="shareBtn">Share this verse</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-box"><div class="stat-num" id="statStreak">0</div><div class="stat-label">Day streak</div></div>
    <div class="stat-box"><div class="stat-num" id="statBest">0</div><div class="stat-label">Best streak</div></div>
    <div class="stat-box"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Verses read</div></div>
  </div>

  <div class="section-title">Badges</div>
  <div class="badges" id="badges"></div>

  <button class="library-btn" id="libraryBtn">📖 View my Verse Library</button>

  <div class="footer-note">A new verse unlocks every day at midnight</div>
</div>

<div class="modal-overlay" id="libraryModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">Verse Library</div>
      <button class="modal-close" id="libraryClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-progress" id="modalProgress"></div>
    <div class="modal-tabs">
      <button class="tab-btn active" id="tabAll">All Verses</button>
      <button class="tab-btn" id="tabThemes">By Theme</button>
    </div>
    <div class="modal-body" id="libraryBody"></div>
  </div>
</div>

];

const DISTRACT_POOL = ["glory","mercy","grace","faith","truth","spirit","strength","comfort","praise","wisdom","courage","patience","kindness","gladness","righteousness","salvation","gentleness","goodness","holiness","refuge"];
const STOPWORDS = new Set(["and","the","that","with","from","unto","which","shall","have","hath","thee","thou","thy","thine","for","but","not","are","was","were","his","her","him","she","they","them","who","will","when","then","than","upon","into","also","among","because","before","after","their","this","these","those","doth","hast","art"]);

/* ---------- Analytics helper ---------- */
function track(name, data){
  try{ if(window.umami) window.umami.track(name, data); }catch(e){}
}

/* ---------- Storage ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}
function dayIndex(){
  const epoch = new Date(2024,0,1);
  const now = new Date();
  const diff = Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - epoch) / 86400000);
  return ((diff % VERSES.length) + VERSES.length) % VERSES.length;
}

let state = LS.get("vq_state", { xp:0, streak:0, best:0, total:0, lastDate:null, completedToday:false, badges:{}, completedIndices:[] });
if(!Array.isArray(state.completedIndices)) state.completedIndices = [];

/* ---------- Levels ---------- */
const LEVELS = [
  {name:"Seed", need:0},
  {name:"Sprout", need:50},
  {name:"Sapling", need:150},
  {name:"Rooted", need:350},
  {name:"Flourishing", need:700},
  {name:"Steadfast", need:1200},
  {name:"Unshaken", need:2000}
];
function levelInfo(xp){
  let cur = LEVELS[0], next = LEVELS[1];
  for(let i=0;i<LEVELS.length;i++){
    if(xp >= LEVELS[i].need){ cur = LEVELS[i]; next = LEVELS[i+1] || null; }
  }
  return {cur, next};
}

const BADGE_DEFS = [
  {id:"d7", label:"7 Days", icon:"7", need: s=>s.best>=7},
  {id:"d30", label:"30 Days", icon:"30", need: s=>s.best>=30},
  {id:"d100", label:"100 Days", icon:"100", need: s=>s.best>=100},
  {id:"v50", label:"50 Verses", icon:"📖", need: s=>s.total>=50},
  {id:"lvl", label:"Unshaken", icon:"👑", need: s=>s.xp>=2000},
  {id:"full", label:"Full Armor", icon:"🏆", need: s=>(s.completedIndices||[]).length >= VERSES.length}
];

/* ---------- Streak roll-over check ---------- */
(function rollover(){
  const today = todayStr();
  if(state.lastDate !== today){
    if(state.lastDate){
      const y = new Date(); y.setDate(y.getDate()-1);
      const yesterdayYMD = y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
      if(state.lastDate !== yesterdayYMD){
        state.streak = 0;
      }
    }
    state.completedToday = false;
    state.challengeDoneToday = false;
  }
})();

/* ---------- Render ---------- */
function render(){
  document.getElementById("streakNum").textContent = state.streak;
  document.getElementById("statStreak").textContent = state.streak;
  document.getElementById("statBest").textContent = state.best;
  document.getElementById("statTotal").textContent = state.total;

  const {cur, next} = levelInfo(state.xp);
  document.getElementById("levelName").textContent = cur.name;
  if(next){
    const pct = Math.min(100, Math.round(((state.xp-cur.need)/(next.need-cur.need))*100));
    document.getElementById("barFill").style.width = pct+"%";
    document.getElementById("levelXp").textContent = state.xp+" / "+next.need+" XP";
  } else {
    document.getElementById("barFill").style.width = "100%";
    document.getElementById("levelXp").textContent = state.xp+" XP · Max";
  }

  const d = new Date();
  document.getElementById("dateLabel").textContent = d.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});

  const badgesEl = document.getElementById("badges");
  badgesEl.innerHTML = "";
  BADGE_DEFS.forEach(b=>{
    const unlocked = b.need(state);
    const div = document.createElement("div");
    div.className = "badge"+(unlocked?" unlocked":"");
    div.innerHTML = `<div class="badge-icon">${b.icon}</div><div class="badge-label">${b.label}</div>`;
    badgesEl.appendChild(div);
  });

  if(state.completedToday){
    document.getElementById("verseWrap").style.display = "block";
    document.getElementById("sealBtn").style.display = "none";
    document.getElementById("tapHint").style.display = "none";
    showFullVerse(false);
    document.getElementById("options").style.display = "none";
    document.getElementById("quizSub").style.display = "none";
    document.getElementById("challengeResult").style.display = "none";
    document.getElementById("doneBadge").style.display = "block";
    document.getElementById("shareBtn").style.display = "inline-block";
  }
}

let verseIdx = dayIndex();
let currentAnswer = "";

function showFullVerse(animate){
  document.getElementById("verseWrap").style.display = "block";
  const [ref, text] = VERSES[verseIdx];
  document.getElementById("verseRef").textContent = ref;
  const words = text.split(" ");
  const textEl = document.getElementById("verseText");
  textEl.innerHTML = "";
  words.forEach((w, i)=>{
    const span = document.createElement("span");
    span.className = "word";
    span.textContent = w;
    span.style.animationDelay = animate ? (i*0.045)+"s" : "0s";
    if(!animate) span.style.opacity = 1;
    textEl.appendChild(span);
    if(i < words.length - 1){
      textEl.appendChild(document.createTextNode("\u00A0"));
    }
  });
}

function pickBlankWord(text){
  const words = text.replace(/[.,;:!?]/g,"").split(" ");
  const candidates = words.map((w,i)=>({w,i})).filter(o => o.w.length>=4 && !STOPWORDS.has(o.w.toLowerCase()));
  const pick = candidates.length ? candidates[Math.floor(Math.random()*candidates.length)] : {w:words[0], i:0};
  return pick.w;
}

function renderQuizVerse(animate){
  document.getElementById("verseWrap").style.display = "block";
  const [ref, text] = VERSES[verseIdx];
  document.getElementById("verseRef").textContent = ref;
  currentAnswer = pickBlankWord(text);
  let blanked = false;
  const words = text.split(" ");
  const textEl = document.getElementById("verseText");
  textEl.innerHTML = "";
  words.forEach((w, i)=>{
    const clean = w.replace(/[.,;:!?]/g,"");
    const trailingPunct = (w.match(/[.,;:!?]$/) || [""])[0];
    const span = document.createElement("span");
    span.className = "word";
    if(clean === currentAnswer && !blanked){
      blanked = true;
      span.classList.add("blank-slot-inline");
      span.dataset.blank = "1";
      span.textContent = "_____" + trailingPunct;
    } else {
      span.textContent = w;
    }
    span.style.animationDelay = animate ? (i*0.045)+"s" : "0s";
    if(!animate) span.style.opacity = 1;
    textEl.appendChild(span);
    if(i < words.length - 1){
      textEl.appendChild(document.createTextNode("\u00A0"));
    }
  });
  buildOptions();
}

function buildOptions(){
  let opts = [currentAnswer];
  const pool = DISTRACT_POOL.filter(w => w.toLowerCase() !== currentAnswer.toLowerCase());
  while(opts.length < 4 && pool.length){
    const idx = Math.floor(Math.random()*pool.length);
    opts.push(pool.splice(idx,1)[0]);
  }
  opts = opts.sort(()=>Math.random()-0.5);

  const optEl = document.getElementById("options");
  optEl.innerHTML = "";
  optEl.style.display = "flex";
  document.getElementById("quizSub").style.display = "block";
  document.getElementById("challengeResult").style.display = "none";
  opts.forEach(o=>{
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = o;
    btn.addEventListener("click", ()=> handleAnswer(btn, o));
    optEl.appendChild(btn);
  });
}

document.getElementById("sealBtn").addEventListener("click", ()=>{
  if(state.completedToday) return;
  const seal = document.getElementById("sealBtn");
  seal.classList.add("seal-crack");
  setTimeout(()=>{
    seal.style.display = "none";
    document.getElementById("tapHint").style.display = "none";
    renderQuizVerse(true);
  }, 480);
});

document.getElementById("shareBtn").addEventListener("click", async ()=>{
  track("share-clicked", { reference: VERSES[verseIdx][0] });
  const [ref, text] = VERSES[verseIdx];
  const shareText = `"${text}" — ${ref}\n\nToday's verse from Verse Quest 🕊️`;
  if(navigator.share){
    try{ await navigator.share({ text: shareText }); }catch(e){}
  } else {
    try{ await navigator.clipboard.writeText(shareText); alert("Verse copied to clipboard"); }catch(e){}
  }
});

function handleAnswer(btn, chosen){
  document.querySelectorAll(".opt-btn").forEach(b=>b.disabled=true);
  const resultEl = document.getElementById("challengeResult");
  const correct = chosen.toLowerCase() === currentAnswer.toLowerCase();

  if(correct){
    btn.classList.add("correct");
    resultEl.textContent = "+25 XP — well remembered";
    resultEl.style.color = "var(--good)";
    state.xp += 25;
    track("challenge-correct", { reference: VERSES[verseIdx][0] });
  } else {
    btn.classList.add("wrong");
    document.querySelectorAll(".opt-btn").forEach(b=>{ if(b.textContent.toLowerCase()===currentAnswer.toLowerCase()) b.classList.add("correct"); });
    resultEl.textContent = "The word was \""+currentAnswer+"\" — +15 XP for trying";
    resultEl.style.color = "var(--gold-deep)";
    state.xp += 15;
    track("challenge-incorrect", { reference: VERSES[verseIdx][0] });
  }
  resultEl.style.display = "block";

  const blankSpan = document.querySelector('[data-blank="1"]');
  if(blankSpan){
    const trailingPunct = (blankSpan.textContent.match(/[.,;:!?]$/) || [""])[0];
    blankSpan.textContent = currentAnswer + trailingPunct;
    blankSpan.classList.remove("blank-slot-inline");
  }

  state.completedToday = true;
  state.lastDate = todayStr();
  state.streak += 1;
  state.best = Math.max(state.best, state.streak);
  state.total += 1;
  if(!state.completedIndices.includes(verseIdx)) state.completedIndices.push(verseIdx);
  LS.set("vq_state", state);
  track("verse-opened", { reference: VERSES[verseIdx][0], streak: state.streak, correct });

  setTimeout(()=>{
    document.getElementById("options").style.display = "none";
    document.getElementById("quizSub").style.display = "none";
    document.getElementById("doneBadge").style.display = "block";
    document.getElementById("shareBtn").style.display = "inline-block";
    render();
  }, 1400);
}

render();

/* ---------- Verse Library / Theme Collections ---------- */
let libTab = "all";

function themeCounts(){
  const totals = {};
  VERSES.forEach(v=>{ totals[v[2]] = (totals[v[2]]||0) + 1; });
  const done = {};
  state.completedIndices.forEach(i=>{ const t = VERSES[i][2]; done[t] = (done[t]||0) + 1; });
  return {totals, done};
}

function renderLibrary(){
  const total = VERSES.length;
  const collected = state.completedIndices.length;
  document.getElementById("modalProgress").textContent = collected + " of " + total + " verses collected";

  const bodyEl = document.getElementById("libraryBody");
  bodyEl.innerHTML = "";

  if(collected === total){
    const banner = document.createElement("div");
    banner.className = "completion-banner";
    banner.textContent = "🏆 Full Armor — you've read every verse in Verse Quest!";
    bodyEl.appendChild(banner);
  }

  if(libTab === "all"){
    if(collected === 0){
      bodyEl.innerHTML += '<div class="lib-empty">Complete your first verse to start your library.</div>';
      return;
    }
    state.completedIndices.slice().sort((a,b)=>a-b).forEach(i=>{
      const [ref, text, theme] = VERSES[i];
      const div = document.createElement("div");
      div.className = "lib-item";
      div.innerHTML = `<div class="lib-ref">${ref}</div><div class="lib-text">${text}</div><div class="lib-theme-tag">${theme}</div>`;
      bodyEl.appendChild(div);
    });
  } else {
    const {totals, done} = themeCounts();
    Object.keys(totals).sort().forEach(theme=>{
      const have = done[theme] || 0;
      const need = totals[theme];
      const pct = Math.round((have/need)*100);
      const row = document.createElement("div");
      row.className = "theme-row";
      row.innerHTML = `
        <div class="theme-row-top"><span>${theme}</span><span>${have} / ${need}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      `;
      bodyEl.appendChild(row);
    });
  }
}

document.getElementById("libraryBtn").addEventListener("click", ()=>{
  document.getElementById("libraryModal").style.display = "flex";
  renderLibrary();
  track("library-opened", { collected: state.completedIndices.length });
});
document.getElementById("libraryClose").addEventListener("click", ()=>{
  document.getElementById("libraryModal").style.display = "none";
});
document.getElementById("libraryModal").addEventListener("click", (e)=>{
  if(e.target.id === "libraryModal") document.getElementById("libraryModal").style.display = "none";
});
document.getElementById("tabAll").addEventListener("click", ()=>{
  libTab = "all";
  document.getElementById("tabAll").classList.add("active");
  document.getElementById("tabThemes").classList.remove("active");
  renderLibrary();
});
document.getElementById("tabThemes").addEventListener("click", ()=>{
  libTab = "themes";
  document.getElementById("tabThemes").classList.add("active");
  document.getElementById("tabAll").classList.remove("active");
  renderLibrary();
});

/* ---------- Install banner ---------- */
(function installBanner(){
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(isStandalone) return;
  if(LS.get("vq_install_dismissed", false)) return;

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  const isAndroid = /android/i.test(navigator.userAgent);
  let msg = "";
  if(isIOS){
    msg = "Install this as an app: tap <b>Share</b> in Safari, then <b>Add to Home Screen</b>.";
  } else if(isAndroid){
    msg = "Install this as an app: tap the <b>⋮</b> menu, then <b>Add to Home Screen</b>.";
  } else {
    return; // desktop — not worth nudging
  }
  document.getElementById("installText").innerHTML = msg;
  document.getElementById("installBanner").style.display = "flex";
  document.getElementById("installClose").addEventListener("click", ()=>{
    document.getElementById("installBanner").style.display = "none";
    LS.set("vq_install_dismissed", true);
  });
})();

/* ---------- Register service worker ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
</body>
